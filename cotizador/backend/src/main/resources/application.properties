# --- Servidor ---
server.port=8080

# --- Base de datos: H2 en archivo (persiste correlativo e historial) ---
# Para migrar a MySQL (como en DentalCare): cambia la url, driver y dialecto,
# y agrega la dependencia mysql-connector-j en el pom.
spring.datasource.url=jdbc:h2:file:./data/cotizaciones;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola H2 opcional para inspeccionar datos en http://localhost:8080/h2-console
spring.h2.console.enabled=true

# --- Configuración de la aplicación ---
# Ruta del machote dentro de resources
app.plantilla=plantillas/Machote_Cotizaciones.docx
# Carpeta donde se guardan los PDF generados
app.pdf-dir=./data/pdfs
# IVA de El Salvador
app.iva=0.13
# Origen permitido para CORS (frontend Vite)
app.cors-origin=http://localhost:5173
